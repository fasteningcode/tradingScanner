{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h1 class="h2 mb-4">
            <i class="bi bi-person-circle text-primary"></i> User Profile
        </h1>
    </div>
</div>

<div class="row">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">Profile Information</h5>
            </div>
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" value="{{ current_user.username }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" value="{{ current_user.email }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="created" class="form-label">Member Since</label>
                        <input type="text" class="form-control" id="created" value="{{ current_user.created_at.strftime('%B %d, %Y') }}" readonly>
                    </div>
                    <button type="button" class="btn btn-primary" disabled>Edit Profile (Coming Soon)</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">Account Stats</h5>
            </div>
            <div class="card-body">
                <p class="mb-2">
                    <strong>Status:</strong>
                    <span class="badge bg-success">Active</span>
                </p>
                <p class="mb-0">
                    <strong>Role:</strong> Member
                </p>
            </div>
        </div>

        <div class="card shadow-sm mt-4">
            <div class="card-header bg-white">
                <h5 class="card-title mb-0">
                    <i class="bi bi-shield-check text-primary"></i> Security
                </h5>
            </div>
            <div class="card-body">
                <p class="text-muted small mb-3">Keep your account secure by regularly updating your password.</p>
                <div class="d-grid">
                    <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline-primary">
                        <i class="bi bi-shield-lock me-2"></i>Change Password
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
