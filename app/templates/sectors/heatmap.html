{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <div class="card card-modern shadow-lg">
            <div class="card-body py-5">
                <div class="mb-4">
                    <i class="bi bi-grid-3x3 display-1 text-muted"></i>
                </div>
                <h1 class="display-4 mb-3">Sector Heatmap</h1>

                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-primary">
